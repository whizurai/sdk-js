name: Publish

# Publishes @whizurai/sdk-js to GitHub Packages when a GitHub Release is published.
# Cut a release (tag e.g. v3.1.0 after bumping package.json) to trigger.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    # Self-hosted ARC scale set for the whizurai org. GITHUB_TOKEN auth is per-job and
    # independent of runner type, so packages: write works the same as on hosted runners.
    runs-on: arc-whizurai
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@whizurai'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec jest --maxWorkers=2
      - run: pnpm build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
